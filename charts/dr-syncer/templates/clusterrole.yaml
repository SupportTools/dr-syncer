{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dr-syncer.fullname" . }}-manager-role
  labels:
    {{- include "dr-syncer.labels" . | nindent 4 }}
rules:
- apiGroups:
  - "dr-syncer.io"
  resources:
  - remoteclusters
  - remoteclusters/status
  - remoteclusters/finalizers
  - namespacemappings
  - namespacemappings/status
  - namespacemappings/finalizers
  - clustermappings
  - clustermappings/status
  - clustermappings/finalizers
  - backuprepositories
  - backuprepositories/status
  - backuprepositories/finalizers
  - volumebackupoperations
  - volumebackupoperations/status
  - volumebackupoperations/finalizers
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
# VolumeSnapshot permissions for CSI snapshot-based backup path
- apiGroups:
  - "snapshot.storage.k8s.io"
  resources:
  - volumesnapshots
  verbs:
  - get
  - list
  - watch
  - create
  - delete
- apiGroups:
  - "snapshot.storage.k8s.io"
  resources:
  - volumesnapshotcontents
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - "snapshot.storage.k8s.io"
  resources:
  - volumesnapshotclasses
  verbs:
  - get
  - list
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - namespaces
  - secrets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - "*"
  resources:
  - "*"
  verbs:
  - get
  - list
  - watch
# Events permission for PVC sync workflow observability
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- nonResourceURLs:
  - "/api"
  - "/api/*"
  - "/apis"
  - "/apis/*"
  verbs:
  - get
{{- end }}
